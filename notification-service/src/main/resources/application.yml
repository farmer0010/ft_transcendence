server:
  port: 8081

spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

slack:
  token: ${SLACK_BOT_TOKEN}
