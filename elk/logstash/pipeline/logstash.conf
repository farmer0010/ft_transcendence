input {
  # backend / notification-service: structured JSON over TCP (logstash-logback-encoder)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["app"]
  }

  # nginx: JSON access log file, tailed from a shared volume (see docker-compose.yml)
  file {
    path => "/var/log/nginx-app/app-access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-nginx-access"
    codec => "json"
    tags => ["nginx", "access"]
  }

  file {
    path => "/var/log/nginx-app/app-error.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-nginx-error"
    tags => ["nginx", "error"]
  }
}

filter {
  if "nginx" in [tags] and "error" in [tags] {
    # nginx error_log lines are plain text: "<time> [<level>] <pid>#<tid>: *<cid> <message>"
    # (the access log is already JSON via log_format json_combined and carries its own "service" field)
    mutate {
      add_field => { "service" => "nginx" }
    }
    grok {
      match => {
        "message" => "%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME} \[%{DATA:level}\] %{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_nginx_error_grok_failure"]
    }
  }

  if [service] {
    # already tagged (nginx) or set by the app (backend/notification-service put
    # "service" in via logstash-logback-encoder's customFields)
  } else {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  # Normalize the level field name across sources (nginx uses "level" from
  # the grok above; the JVM apps send "level" natively from logback).
  if ![level] {
    mutate {
      add_field => { "level" => "INFO" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${LOGSTASH_ES_USER}"
    password => "${LOGSTASH_ES_PASSWORD}"
    index => "app-logs"
  }
}
