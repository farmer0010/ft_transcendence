services:
  mariadb:
    image: mariadb:10.6
    container_name: cabi_db
    restart: always
    environment:
      MARIADB_DATABASE: cabi
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "13306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h127.0.0.1 -u$$DB_USER -p$$DB_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: cabi_redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      TZ: Asia/Seoul
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    build: ./ai
    container_name: cabi_ai
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODEL_PATH=${AI_MODEL_PATH}
    # healthcheck is already declared in ai/Dockerfile (GET /health)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    container_name: cabi_backend
    build: ./backend
    restart: on-failure
    expose:
      - "8080"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/cabi?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&useSSL=false
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ALLOW_INSECURE=true
      - FT_CLIENT_ID=${FT_CLIENT_ID}
      - FT_CLIENT_SECRET=${FT_CLIENT_SECRET}
      - jwt.secret=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_42_REDIRECT_URI=${FRONTEND_URL}/login/oauth2/code/42
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI=${FRONTEND_URL}/login/oauth2/code/kakao
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=${FRONTEND_URL}/login/oauth2/code/google
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - SPRING_CLOUD_AZURE_STORAGE_BLOB_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AI_SERVER_URL=http://ai:8000
      - COOKIE_SECURE=${COOKIE_SECURE}
      - TZ=Asia/Seoul
    networks:
      default:
        aliases:
          - cabi_backend_blue
          - cabi_backend_green
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    container_name: cabi_notification
    build: ./notification-service
    restart: on-failure
    expose:
      - "8081"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - TZ=Asia/Seoul
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    container_name: cabi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/v4/cabinets/status-summary/all || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fe:
    build: ./fe
    container_name: cabi_fe
    restart: always
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: cabi_prometheus
    volumes:
      - ./backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    expose:
      - "9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    build: ./backup
    container_name: cabi_backup
    restart: always
    environment:
      - DB_HOST=mariadb
      - DB_NAME=cabi
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_DATA_DIR=/redis_data
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-7}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - TZ=Asia/Seoul
    volumes:
      - ./backups:/backups
      - ./redis_data:/redis_data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f entrypoint.sh || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: cabi_grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - grafana_data:/var/lib/grafana

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cabi_uptime_kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  uptime-kuma-init:
    build: ./uptime-kuma/provision
    container_name: cabi_uptime_kuma_init
    restart: "no"
    environment:
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
      - UPTIME_KUMA_ADMIN_USER=${UPTIME_KUMA_ADMIN_USER}
      - UPTIME_KUMA_ADMIN_PASSWORD=${UPTIME_KUMA_ADMIN_PASSWORD}
    depends_on:
      uptime-kuma:
        condition: service_healthy
      backend:
        condition: service_healthy
      nginx:
        condition: service_healthy

volumes:
  grafana_data:
  uptime_kuma_data:
